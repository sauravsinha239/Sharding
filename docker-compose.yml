
services:
  shard1:
    image: postgres:18
    container_name: pg-shard-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharddb
      POSTGRES_USER: sharduser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - shard1_data:/var/lib/postgresql
    networks:
      - sharding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharduser -d sharddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  shard2:
    image: postgres:18
    container_name: pg-shard-2
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharddb
      POSTGRES_USER: sharduser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - shard2_data:/var/lib/postgresql
    networks:
      - sharding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharduser -d sharddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  shard3:
    image: postgres:18
    container_name: pg-shard-3
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharddb
      POSTGRES_USER: sharduser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - shard3_data:/var/lib/postgresql
    networks:
      - sharding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharduser -d sharddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-sharding
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@saurav.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sharding-network

volumes:
  shard1_data:
  shard2_data:
  shard3_data:
  pgadmin_data:

networks:
  sharding-network:
    driver: bridge
